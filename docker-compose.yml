services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./db/structure.sql:/docker-entrypoint-initdb.d/structure.sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./back
    restart: unless-stopped
    volumes:
      - ./back:/app
      - /app/node_modules
    working_dir: /app
    command: yarn dev:docker
    environment:
      PORT: 3000
      MEMORY_TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/up >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: ./front
    restart: unless-stopped
    volumes:
      - ./front:/app
      - /app/node_modules
    working_dir: /app
    command: yarn start
    environment:
      API_PROXY_TARGET: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
      WDS_SOCKET_PORT: "0"
    ports:
      - "4200:4200"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4200/ >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  database_data:
